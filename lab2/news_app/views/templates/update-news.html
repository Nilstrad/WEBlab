<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update News</title>
    <link rel="stylesheet" href="../../static/style.css">
</head>
<body>
    <h1>Update News</h1>
    <div class="form-container">
        <form id="update-news-form">
            <label for="id">News ID:</label>
            <input type="text" id="id" name="id" required><br><br>

            <label for="title">Title:</label>
            <input type="text" id="title" name="title"><br><br>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author"><br><br>

            <label for="content">Content:</label>
            <textarea id="content" name="content"></textarea><br><br>

            <button type="submit" class="button">Update News</button>
        </form>
    </div>

    <script>
        document.getElementById("update-news-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const id = document.getElementById("id").value;
            const title = document.getElementById("title").value;
            const author = document.getElementById("author").value;
            const content = document.getElementById("content").value;

            const response = await fetch(`http://localhost:8080/api/news/update/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author, content })
            });

            if (response.ok) {
                alert("News updated successfully!");
            } else {
                alert("Failed to update news.");
            }
        });
    </script>
</body>
</html>
