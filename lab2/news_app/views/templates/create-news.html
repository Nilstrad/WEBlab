<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Create News</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>Create News</h1>

    <div class="form-container">
        <form id="create-news-form">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br><br>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required><br><br>

            <label for="content">Content:</label>
            <textarea id="content" name="content" required></textarea><br><br>

            <button type="submit" class="button">Create News</button>
        </form>
    </div>

    <script>
        document.getElementById("create-news-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const title = document.getElementById("title").value;
            const author = document.getElementById("author").value;
            const content = document.getElementById("content").value;

            const response = await fetch("http://localhost:8080/api/news/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author, content })
            });

            if (response.ok) {
                alert("News created successfully!");
            } else {
                alert("Failed to create news.");
            }
        });
    </script>
</body>
</html>
